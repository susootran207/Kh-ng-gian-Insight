<svg xmlns="http://www.w3.org/2000/svg" width="320" height="715" viewBox="0 0 320 715" role="img" aria-labelledby="title desc" xml:lang="vi">
<title id="title">Giữ sai sót đúng với sự việc</title>
<desc id="desc">Cùng một sai sót gửi nhầm tệp: giữ dữ kiện và trách nhiệm, nhận biết điều khó chịu, chọn việc sửa; tránh dùng sai sót để phán xét toàn bộ con người.</desc>
<rect width="320" height="715" fill="#fffdf7"/>
<g font-family="DejaVu Sans, sans-serif" fill="#333e32">
<text x="20" y="36" font-size="22" font-weight="700">Giữ sai sót đúng với</text>
<text x="20" y="67" font-size="22" font-weight="700">sự việc</text>
<rect x="16" y="114" width="288" height="134" rx="6" fill="#e9e2ee" stroke="#616656"/>
<text x="32" y="143" font-size="18" font-weight="700">CÙNG MỘT VIỆC</text>
<text x="32" y="170" font-size="16">Trang gửi nhầm tệp. Không đủ</text>
<text x="32" y="195" font-size="16">để nói “chẳng làm được việc</text>
<text x="32" y="220" font-size="16">gì”.</text>
<rect x="16" y="268" width="288" height="84" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="297" font-size="18" font-weight="700">VIỆC CỤ THỂ</text>
<text x="32" y="324" font-size="16">Tệp cũ thiếu một đoạn đã sửa.</text>
<rect x="16" y="372" width="288" height="84" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="401" font-size="18" font-weight="700">ĐIỀU ĐƯỢC KỂ</text>
<text x="32" y="428" font-size="16">Trang đang xấu hổ.</text>
<rect x="16" y="476" width="288" height="109" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="505" font-size="18" font-weight="700">VIỆC SỬA / NHỜ GIÚP</text>
<text x="32" y="532" font-size="16">Báo nhóm; gửi bản đúng nếu</text>
<text x="32" y="557" font-size="16">còn kịp.</text>
<text x="20" y="615" font-size="16">Giữ trách nhiệm, không gắn nhãn</text>
<text x="20" y="640" font-size="16">cả con người. Ba ô viết lại do bài</text>
<text x="20" y="665" font-size="16">tạo, không mô hình Neff.</text>
</g>
</svg>
