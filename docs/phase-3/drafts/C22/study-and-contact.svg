<svg xmlns="http://www.w3.org/2000/svg" width="320" height="711" viewBox="0 0 320 711" role="img" aria-labelledby="title desc" xml:lang="vi">
<title id="title">Giữ việc học, giữ liên lạc</title>
<desc id="desc">Ba thẻ về ví dụ bị ngắt khi đọc, kế hoạch giảm phần không cần mà giữ liên lạc thiết yếu, cùng dấu quay lại và khoảng nghỉ; không có điểm số hoặc lịch phút tối ưu.</desc>
<rect width="320" height="711" fill="#fffdf7"/>
<g font-family="DejaVu Sans, sans-serif" fill="#333e32">
<text x="20" y="36" font-size="22" font-weight="700">Giữ việc học, giữ liên</text>
<text x="20" y="67" font-size="22" font-weight="700">lạc</text>
<rect x="16" y="114" width="288" height="134" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="143" font-size="18" font-weight="700">VÍ DỤ BỊ NGẮT</text>
<text x="32" y="170" font-size="16">Hoàng đang đọc rồi trả lời</text>
<text x="32" y="195" font-size="16">nhóm, xem video; quay lại</text>
<text x="32" y="220" font-size="16">phải tìm chỗ đọc.</text>
<rect x="16" y="268" width="288" height="134" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="297" font-size="18" font-weight="700">KẾ HOẠCH CÓ THỂ THỬ</text>
<text x="32" y="324" font-size="16">Giữ kênh liên lạc cần thiết;</text>
<text x="32" y="349" font-size="16">giảm phần không cần nếu</text>
<text x="32" y="374" font-size="16">điều kiện cho phép.</text>
<rect x="16" y="422" width="288" height="134" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="451" font-size="18" font-weight="700">CHỖ ĐỂ QUAY LẠI</text>
<text x="32" y="478" font-size="16">Đánh dấu đoạn đang đọc; có</text>
<text x="32" y="503" font-size="16">khoảng nghỉ và điều chỉnh khi</text>
<text x="32" y="528" font-size="16">cần.</text>
<text x="20" y="586" font-size="16">Đây là ví dụ và phương án thử,</text>
<text x="20" y="611" font-size="16">không kết quả đo trước–sau.</text>
<text x="20" y="636" font-size="16">Không phải ai cũng đổi được cài</text>
<text x="20" y="661" font-size="16">đặt điện thoại.</text>
</g>
</svg>
