<svg xmlns="http://www.w3.org/2000/svg" width="320" height="638" viewBox="0 0 320 638" role="img" aria-labelledby="title desc" xml:lang="vi">
<title id="title">Giận và lựa chọn hành động</title>
<desc id="desc">Thẻ tình huống giận phân biệt tín hiệu được kể, tạm dừng tại nơi an toàn và chọn lời nói hoặc người hỗ trợ khi sẵn sàng; không yêu cầu hết giận trong một số phút.</desc>
<rect width="320" height="638" fill="#fffdf7"/>
<g font-family="DejaVu Sans, sans-serif" fill="#333e32">
<text x="20" y="36" font-size="22" font-weight="700">Giận và lựa chọn hành</text>
<text x="20" y="67" font-size="22" font-weight="700">động</text>
<rect x="16" y="114" width="288" height="109" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="143" font-size="18" font-weight="700">1 · ĐỌC ĐIỀU ĐƯỢC KỂ</text>
<text x="32" y="170" font-size="16">Dũng nói giận, vai căng. Muốn</text>
<text x="32" y="195" font-size="16">nói khác với đã nói.</text>
<rect x="16" y="243" width="288" height="136" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="272" font-size="18" font-weight="700">2 · CÂN NHẮC TẠM</text>
<text x="32" y="299" font-size="18" font-weight="700">DỪNG</text>
<text x="32" y="326" font-size="16">Ở nơi an toàn, phù hợp lớp. Có</text>
<text x="32" y="351" font-size="16">thể xin dừng tại chỗ.</text>
<rect x="16" y="399" width="288" height="109" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="428" font-size="18" font-weight="700">3 · CHỌN KHI SẴN SÀNG</text>
<text x="32" y="455" font-size="16">Nói về việc cần sửa hoặc nhờ</text>
<text x="32" y="480" font-size="16">người lớn hỗ trợ.</text>
<text x="20" y="538" font-size="16">Có thể nhờ người lớn ngay. Số chỉ</text>
<text x="20" y="563" font-size="16">cách đọc bài tập, không giai đoạn</text>
<text x="20" y="588" font-size="16">cảm xúc hay hạn hết giận.</text>
</g>
</svg>
