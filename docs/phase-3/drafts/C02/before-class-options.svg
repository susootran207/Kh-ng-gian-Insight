<svg xmlns="http://www.w3.org/2000/svg" width="320" height="804" viewBox="0 0 320 804" role="img" aria-labelledby="title desc" xml:lang="vi">
<title id="title">Trước giờ học: nhìn và chọn</title>
<desc id="desc">Thẻ trước giờ học tách điều nhân vật kể, điều còn chưa biết, một việc khả thi và người có thể hỗ trợ; không có điểm số hoặc ngưỡng chẩn đoán.</desc>
<rect width="320" height="804" fill="#fffdf7"/>
<g font-family="DejaVu Sans, sans-serif" fill="#333e32">
<text x="20" y="36" font-size="22" font-weight="700">Trước giờ học: nhìn và</text>
<text x="20" y="67" font-size="22" font-weight="700">chọn</text>
<rect x="16" y="114" width="288" height="109" rx="6" fill="#e9e2ee" stroke="#616656"/>
<text x="32" y="143" font-size="18" font-weight="700">DỮ KIỆN ĐƯỢC KỂ</text>
<text x="32" y="170" font-size="16">Hạnh nói mình lo. Bụng khó</text>
<text x="32" y="195" font-size="16">chịu; kiểm lại tờ giấy.</text>
<rect x="16" y="243" width="288" height="134" rx="6" fill="#e9e2ee" stroke="#616656"/>
<text x="32" y="272" font-size="18" font-weight="700">ĐIỀU CHƯA BIẾT</text>
<text x="32" y="299" font-size="16">Chưa biết lớp sẽ phản ứng ra</text>
<text x="32" y="324" font-size="16">sao hoặc nguyên nhân bụng</text>
<text x="32" y="349" font-size="16">khó chịu.</text>
<rect x="16" y="409" width="288" height="109" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="438" font-size="18" font-weight="700">MỘT VIỆC KHẢ THI</text>
<text x="32" y="465" font-size="16">Hỏi lại lượt đọc hoặc bàn cách</text>
<text x="32" y="490" font-size="16">chuẩn bị vừa sức.</text>
<rect x="16" y="538" width="288" height="136" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="567" font-size="18" font-weight="700">NGƯỜI / ĐIỀU MUỐN</text>
<text x="32" y="594" font-size="18" font-weight="700">NHỜ</text>
<text x="32" y="621" font-size="16">Có thể nhờ giáo viên cùng bàn</text>
<text x="32" y="646" font-size="16">cách tham gia phù hợp.</text>
<text x="20" y="704" font-size="16">Chưa làm được? Điều chỉnh hoặc</text>
<text x="20" y="729" font-size="16">tìm người phù hợp khác. Không</text>
<text x="20" y="754" font-size="16">cần hết lo mới được giúp.</text>
</g>
</svg>
