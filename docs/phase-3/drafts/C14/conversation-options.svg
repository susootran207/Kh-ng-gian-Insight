<svg xmlns="http://www.w3.org/2000/svg" width="320" height="688" viewBox="0 0 320 688" role="img" aria-labelledby="title desc" xml:lang="vi">
<title id="title">Mở lời có đường khác</title>
<desc id="desc">Thẻ trò chuyện có phần chuẩn bị người, lúc và việc muốn nhờ; ba phương án khi người lớn đang bận, hiểu khác ý, hoặc không phù hợp hay không an toàn.</desc>
<rect width="320" height="688" fill="#fffdf7"/>
<g font-family="DejaVu Sans, sans-serif" fill="#333e32">
<text x="20" y="36" font-size="22" font-weight="700">Mở lời có đường khác</text>
<rect x="16" y="83" width="288" height="107" rx="6" fill="#e9e2ee" stroke="#616656"/>
<text x="32" y="112" font-size="18" font-weight="700">CHUẨN BỊ</text>
<text x="32" y="139" font-size="16">Người và lúc phù hợp. Một dữ</text>
<text x="32" y="164" font-size="16">kiện. Một việc muốn nhờ.</text>
<rect x="16" y="222" width="288" height="107" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="251" font-size="18" font-weight="700">ĐANG BẬN</text>
<text x="32" y="278" font-size="16">Có thể hỏi hẹn một thời điểm</text>
<text x="32" y="303" font-size="16">khác.</text>
<rect x="16" y="349" width="288" height="107" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="378" font-size="18" font-weight="700">HIỂU KHÁC Ý</text>
<text x="32" y="405" font-size="16">Có thể làm rõ một dữ kiện;</text>
<text x="32" y="430" font-size="16">không cần kể hết.</text>
<rect x="16" y="476" width="288" height="107" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="505" font-size="18" font-weight="700">KHÔNG PHÙ HỢP</text>
<text x="32" y="532" font-size="16">Không thấy an toàn? Có thể</text>
<text x="32" y="557" font-size="16">dừng và tìm người lớn khác.</text>
<text x="20" y="613" font-size="16">Ba lựa chọn theo tình huống,</text>
<text x="20" y="638" font-size="16">không phải ba bước bắt buộc.</text>
</g>
</svg>
