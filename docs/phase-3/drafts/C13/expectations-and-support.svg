<svg xmlns="http://www.w3.org/2000/svg" width="320" height="661" viewBox="0 0 320 661" role="img" aria-labelledby="title desc" xml:lang="vi">
<title id="title">Mong đợi, điều cần, người giúp</title>
<desc id="desc">Hai phương án cân nhắc: khi trao đổi an toàn thì chuẩn bị việc, nhu cầu và lời nhờ; khi không an toàn thì tìm người lớn khác, không phải thử thuyết phục trước.</desc>
<rect width="320" height="661" fill="#fffdf7"/>
<g font-family="DejaVu Sans, sans-serif" fill="#333e32">
<text x="20" y="36" font-size="22" font-weight="700">Mong đợi, điều cần,</text>
<text x="20" y="67" font-size="22" font-weight="700">người giúp</text>
<rect x="16" y="114" width="288" height="109" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="143" font-size="18" font-weight="700">HAI ĐIỀU CẦN TÁCH</text>
<text x="32" y="170" font-size="16">Mong kết quả cao khác với</text>
<text x="32" y="195" font-size="16">điều kiện đang cần để học.</text>
<rect x="16" y="243" width="288" height="109" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="272" font-size="18" font-weight="700">NẾU TRAO ĐỔI AN TOÀN</text>
<text x="32" y="299" font-size="16">Chuẩn bị việc đang có, điều</text>
<text x="32" y="324" font-size="16">cần và một việc muốn nhờ.</text>
<rect x="16" y="372" width="288" height="134" rx="6" fill="#e9e2ee" stroke="#616656"/>
<text x="32" y="401" font-size="18" font-weight="700">NẾU KHÔNG AN TOÀN</text>
<text x="32" y="428" font-size="16">Chọn người lớn an toàn khác.</text>
<text x="32" y="453" font-size="16">Không cần thử thuyết phục</text>
<text x="32" y="478" font-size="16">người đe dọa.</text>
<text x="20" y="536" font-size="16">Hai phương án tùy hoàn cảnh,</text>
<text x="20" y="561" font-size="16">không hai bước phải qua. Không</text>
<text x="20" y="586" font-size="16">phải chịu đựng trước khi được</text>
<text x="20" y="611" font-size="16">giúp.</text>
</g>
</svg>
