<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1270" viewBox="0 0 320 1270" role="img" aria-labelledby="title desc">
<title id="title">Giấc ngủ của Lan: bối cảnh và bài tập</title>
<desc id="desc">Nhóm A có ba khối bối cảnh: nhu cầu ngủ theo tuổi, lịch học và việc nhà, môi trường ngủ dùng chung. Nhóm B có ba khối bài tập: tách dữ kiện với điều chưa biết, chọn thay đổi khả thi, xác định hỗ trợ hoặc điều chỉnh. Hai nhóm có khung và tiêu đề riêng; số chỉ bước bài tập, không phải quá trình sinh học. Không có đường nối nhân quả.</desc>
<rect width="320" height="1270" fill="#f7f3e9"/>
<g fill="#333e32" font-family="DejaVu Sans, sans-serif">
<text x="20" y="32" font-size="21" font-weight="bold">Giấc ngủ của Lan</text>
<text x="20" y="60" font-size="16">Tình huống giả định: Lan, 14 tuổi</text>
<g id="context" role="group" aria-labelledby="context-heading">
<rect class="group-frame" x="12" y="88" width="296" height="520" rx="6" fill="#fffdf7" stroke="#655274" stroke-width="1.5"/>
<text x="26" y="114" font-size="14" font-weight="bold">NHÓM A · BỐI CẢNH</text>
<text id="context-heading" x="26" y="145" font-size="21" font-weight="bold">Nhìn trong bối cảnh</text>
<text x="26" y="175" font-size="16">Ba điều cần nhìn cùng nhau.</text>
<rect class="content-card" x="24" y="204" width="272" height="112" rx="3" fill="#dce3d2"/>
<text x="36" y="233" font-size="17" font-weight="bold">Nhu cầu ngủ theo tuổi</text>
<text x="36" y="265" font-size="16">Xem nhóm tuổi trong bài.</text>
<text x="36" y="290" font-size="16">Không tự kết luận bệnh.</text>
<rect class="content-card" x="24" y="336" width="272" height="112" rx="3" fill="#dce3d2"/>
<text x="36" y="365" font-size="17" font-weight="bold">Lịch học và việc nhà</text>
<text x="36" y="397" font-size="16">Lan phải dậy sớm đi học,</text>
<text x="36" y="422" font-size="16">còn phụ dọn hàng buổi tối.</text>
<rect class="content-card" x="24" y="468" width="272" height="112" rx="3" fill="#dce3d2"/>
<text x="36" y="497" font-size="17" font-weight="bold">Môi trường ngủ chung</text>
<text x="36" y="529" font-size="16">Phòng còn đèn sáng</text>
<text x="36" y="554" font-size="16">và có tiếng nói chuyện.</text>
</g>
<g id="activity" role="group" aria-labelledby="activity-heading">
<rect class="group-frame" x="12" y="652" width="296" height="556" rx="6" fill="#fffdf7" stroke="#655274" stroke-width="1.5"/>
<text x="26" y="678" font-size="14" font-weight="bold">NHÓM B · BÀI TẬP</text>
<text id="activity-heading" x="26" y="709" font-size="21" font-weight="bold">Làm trong bài tập</text>
<text x="26" y="739" font-size="16">Dùng mẫu, không chẩn đoán.</text>
<rect class="content-card" x="24" y="772" width="272" height="112" rx="3" fill="#e9e2ee"/>
<text x="36" y="801" font-size="17" font-weight="bold">1. Tách dữ kiện</text>
<text x="36" y="833" font-size="16">Điều nào đã biết?</text>
<text x="36" y="858" font-size="16">Điều nào còn chưa biết?</text>
<rect class="content-card" x="24" y="904" width="272" height="112" rx="3" fill="#e9e2ee"/>
<text x="36" y="933" font-size="17" font-weight="bold">2. Chọn thay đổi</text>
<text x="36" y="965" font-size="16">Việc gì có thể thử?</text>
<text x="36" y="990" font-size="16">Cần điều kiện nào?</text>
<rect class="content-card" x="24" y="1036" width="272" height="112" rx="3" fill="#e9e2ee"/>
<text x="36" y="1065" font-size="17" font-weight="bold">3. Hỗ trợ / điều chỉnh</text>
<text x="36" y="1097" font-size="16">Nói với ai, về việc gì?</text>
<text x="36" y="1122" font-size="16">Nếu chưa làm được thì sao?</text>
</g>
<text x="20" y="1238" font-size="15">Sơ đồ học tập tự biên soạn.</text>
<text x="20" y="1262" font-size="15">Không biểu thị quan hệ nhân quả.</text>
</g></svg>
